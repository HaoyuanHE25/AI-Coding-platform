spring:
  application:
    name: AICodingPlatform
    # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_coding_platform
    username: root
    password: 123456
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      ttl: 3600
  profiles:
    active: local
server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
# 应用部署访问地址（含静态资源前缀），生产环境必须通过 CODE_DEPLOY_HOST 覆盖
code:
  deploy-host: ${CODE_DEPLOY_HOST:http://localhost:8123/api/static}
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.haoyuan.aicodingplatform.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

